name: Metrics preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Classic template
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: King52HerTz
          filename: preview/metrics-classic.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          config_display: large

      - name: Themed stats card (tokyonight)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=King52HerTz&show_icons=true&theme=tokyonight&border_radius=12&card_width=620&locale=cn
          path: preview/stats-tokyonight.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Themed stats card (radical)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=King52HerTz&show_icons=true&theme=radical&border_radius=12&card_width=620&locale=cn
          path: preview/stats-radical.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/*.svg
          git commit -m "chore: update card previews" || exit 0
          git pull --rebase --autostash
          git push
