name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/grs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=F6F8FA&title_color=0969DA&text_color=1F2328&icon_color=8250DF&border_radius=10&card_width=620&locale=cn&hide=contribs&custom_title=Eliauk%20%C2%B7%20GitHub%20Stats
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=161B22&title_color=58A6FF&text_color=C9D1D9&icon_color=BC8CFF&border_radius=10&card_width=620&locale=cn&hide=contribs&custom_title=Eliauk%20%C2%B7%20GitHub%20Stats
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Flatten animation-dependent parts
        run: python3 scripts/flatten-svg.py profile/*.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: 刷新统计卡（本地生成，含评级）" || exit 0
          git pull --rebase --autostash
          git push
